name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke-tests:
    name: Script smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Bash syntax
        run: bash -n ./*.sh tests/*.sh

      - name: Verify bundled model
        run: test "$(sha256sum models/SmolLM2-135M-Instruct.Q4_0.gguf | cut -d' ' -f1)" = "f68203bfb98b1b1e8c64fac75fab10c4e36acac081609573b4df0fcc19c90dd9"

      - name: Test Bash generator
        run: bash tests/test-generators.sh

      - name: Test PowerShell generator
        shell: pwsh
        run: ./tests/Test-Generators.ps1
